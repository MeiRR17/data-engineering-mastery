version: 2
models:
  - name: stg_events
    description: Synthetic earthquake source records.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: observed_at
        data_tests: [not_null]
  - name: stg_regions
    description: Slowly changing region dimension.
    columns:
      - name: region_version_key
        data_tests: [unique, not_null]
  - name: fct_earthquakes
    description: One row per event, joined to its historic region version.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_events')
                field: event_id
      - name: region_version_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_version_key
  - name: daily_region_metrics
    description: UTC date by historically valid region name.
    columns:
      - name: day_utc
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]
