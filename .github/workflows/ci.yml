name: Learning repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate learning content
        run: python3 scripts/validate_repo.py
      - name: English-first Markdown, Jupyter and VS Code experience
        run: python3 scripts/check_english_content.py
      - name: Audit all 14 stage learning assets
        run: python3 scripts/audit_program.py
      - name: Execute all 10 advanced guided notebook checks
        run: python3 scripts/notebook_smoke.py
      - name: Tutor tool tests
        run: python3 -m unittest discover -s tests -v
      - name: DataPulse tests
        run: python3 -m unittest discover -s projects/datapulse/tests -v
        env:
          PYTHONPATH: projects/datapulse/src
      - name: DataPulse local dry-run
        run: python3 -m datapulse.ingest --fixture projects/datapulse/data/sample.geojson --dry-run
        env:
          PYTHONPATH: projects/datapulse/src

      - name: Stage 06 orchestration grader (reference)
        run: python3 labs/06-orchestration/grade.py --reference

      - name: Stage 07 quality reference grader (27 tests)
        run: python3 labs/07-quality/grade.py --reference

      - name: Stage 08 HTTP read-only and dashboard asset tests
        run: |
          python3 labs/08-serving/grade.py
          node --check labs/08-serving/web/app.js
          python3 labs/08-serving/learner/grade.py --reference

      - name: Stage 11 streaming semantics and crash-safe checkpointing
        run: |
          python3 labs/11-streaming/grade.py --reference
          python3 labs/11-streaming/demo.py

      - name: Stage 12 reliability, safe backup/restore and incident drill
        run: |
          python3 labs/12-reliability/grade.py --reference
          python3 labs/12-reliability/incident_drill.py

  postgres-stage04:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage 04 disposable PostgreSQL integration
        run: python3 labs/04-postgres/run_lab.py --reference

  postgres-stage05:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage 05 disposable PostgreSQL dimensional modeling
        run: python3 labs/05-modeling/run_lab.py --reference

  dbt-stage05:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dbt versions pinned for teaching
        run: python3 -m pip install "dbt-core==1.11.16" "dbt-postgres==1.11.0"
      - name: Reproduce dbt seed and model tests twice
        env:
          DBT_PG_PASSWORD: disposable-ci-only
        run: |
          dbt debug --project-dir labs/05-modeling/dbt --profiles-dir labs/05-modeling/dbt
          dbt seed --project-dir labs/05-modeling/dbt --profiles-dir labs/05-modeling/dbt
          dbt build --project-dir labs/05-modeling/dbt --profiles-dir labs/05-modeling/dbt
          dbt build --project-dir labs/05-modeling/dbt --profiles-dir labs/05-modeling/dbt


  release-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Checkout no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 26 Stage 09 delivery and rollback scenarios
        run: python3 labs/09-cicd/grade.py --reference
      - name: Perform offline promotion and rollback demonstration
        run: python3 labs/09-cicd/demo.py


  spark-stage10:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    steps:
      - name: Checkout no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17 for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local PySpark
        run: python3 -m pip install "pyspark==4.0.5"
      - name: Verify real Spark and light output match
        run: python3 labs/10-spark/spark_pipeline.py --partitions 2
      - name: Grade instructor Spark Window and shuffle logic
        run: python3 labs/10-spark/spark_grade.py --reference
      - name: Demonstrate partition skew on synthetic events
        run: python3 labs/10-spark/skew_demo.py


  kafka-stage11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Kafka client
        run: python3 -m pip install "confluent-kafka==2.16.1"
      - name: Launch disposable loopback-only Kafka broker
        run: |
          docker run -d --rm --name dem-stage11-kafka \
            -p 127.0.0.1:9092:9092 apache/kafka:4.4.0
      - name: Real Kafka produce/consume/replay and broker offset check
        run: python3 labs/11-streaming/kafka_demo.py --broker 127.0.0.1:9092
      - name: Remove only the temporary training broker
        if: always()
        run: docker rm -f dem-stage11-kafka || true

  desktop-vscode-jupyter-e2e:
    name: "Real VS Code/Jupyter on OS: ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout without retaining credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official VS Code CLI on disposable Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 20 \
            -o "$RUNNER_TEMP/vscode-linux.deb" \
            "https://update.code.visualstudio.com/latest/linux-deb-x64/stable"
          file "$RUNNER_TEMP/vscode-linux.deb" | grep -F "Debian binary package"
          sudo apt-get install -y "$RUNNER_TEMP/vscode-linux.deb"
          code --version
          echo "VSCODE_CLI=$(command -v code)" >> "$GITHUB_ENV"

      - name: Install official VS Code CLI on disposable Apple Silicon macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 20 \
            -o "$RUNNER_TEMP/vscode-macos.zip" \
            "https://update.code.visualstudio.com/latest/darwin-arm64/stable"
          mkdir -p "$RUNNER_TEMP/vscode-macos"
          ditto -xk "$RUNNER_TEMP/vscode-macos.zip" "$RUNNER_TEMP/vscode-macos"
          cli="$RUNNER_TEMP/vscode-macos/Visual Studio Code.app/Contents/Resources/app/bin/code"
          test -x "$cli"
          "$cli" --version
          echo "VSCODE_CLI=$cli" >> "$GITHUB_ENV"

      - name: Install official VS Code CLI on disposable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'vscode-windows.zip'
          Invoke-WebRequest -Uri 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP 'vscode-windows'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $cli = Join-Path $dest 'bin\code.cmd'
          if (-not (Test-Path -LiteralPath $cli)) { throw 'VS Code CLI missing from official archive' }
          & $cli --version
          Add-Content -Path $env:GITHUB_ENV -Value "VSCODE_CLI=$cli"

      - name: Install extensions and run all 14 notebooks on real Jupyter (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/bootstrap-learning.sh --all

      - name: Install extensions and run all 14 notebooks on real Jupyter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:COURSE_PYTHON = Join-Path $env:pythonLocation 'python.exe'
          & $env:COURSE_PYTHON --version
          powershell -NoProfile -ExecutionPolicy RemoteSigned -File scripts/bootstrap-learning.ps1 -Mode all
          if ($LASTEXITCODE -ne 0) { throw 'Windows course setup or notebook CI failed' }

      - name: Verify generated local evidence (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("learner/setup-check.local.json").read_text())
          assert x["status"] == "PASS", x["issues"]
          assert len(x["installed_extensions"]) == 4
          assert len(x["executed_notebooks"]) == 14
          assert x["markdown_parsed_to_html"] is True
          assert x["execution_scope"] == "THIS_CLI_CONTEXT_ONLY"
          print("PASS: installed VS Code extensions, Markdown and all 14 Jupyter notebooks")
          PY

      - name: Verify generated local evidence (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $r = Get-Content learner\setup-check.local.json -Raw | ConvertFrom-Json
          if ($r.status -ne 'PASS') { throw 'Local readiness was not PASS' }
          if ($r.installed_extensions.PSObject.Properties.Count -ne 4) { throw 'Missing extensions' }
          if ($r.executed_notebooks.Count -ne 14) { throw 'Not all notebooks executed' }
          if (-not $r.markdown_parsed_to_html) { throw 'Markdown render failed' }
          Write-Host 'PASS: actual Windows VS Code extensions and Jupyter runtime'

  capstone-stage13:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify integrated capstone reference
        run: python3 capstone/grade.py --reference
      - name: Run end-to-end synthetic DataPulse demonstration
        run: python3 capstone/demo.py
      - name: Generate reviewer-separated transfer fixture
        run: |
          python3 assessment/generate_transfer.py --seed 20261105 --output /tmp/dem-training-exam
          test -s /tmp/dem-training-exam/candidate/events.jsonl
          test -s /tmp/dem-training-exam/reviewer_only/answer_key.json
